mission_statement:
  - "Software Engineer with 15 years' experience shipping production systems and an M.S. in Computer Science (Machine Learning) from UT Dallas."
  - "Targeting SW/Systems Engineering roles in hard-tech, defense, and aerospace on frontier teams making civilization-scale impact."

qualifications:
  title: Qualifications
  items:
    - "Enterprise software delivery: 15 years building and shipping production systems, including multi-tenant enterprise and consumer facing SaaS products across consulting and in-house roles."
    - "Outcome Ownership under ambiguity: led multiple simultaneous delivery teams across multiple clients as responsible party. Hired, trained, and mentored numerous software engineers at various stages in their careers. Stakeholder discovery; executive relationship management; signing authority."
    - "Full-stack product engineering and delivery: C#/.NET, TypeScript, Angular, React, SQL Server, RESTful APIs; automated testing, CI/CD pipelines, and release automation across AWS and Azure."
    - "Cloud infrastructure and operations: event-driven ETL, containers, and serverless/Fargate workloads on AWS and Azure, with application logging and metrics (Application Insights, CloudWatch, Seq). Fully-scripted IoC defined cloud environments (ARM, Bicep, CloudFormation, AWS CLI)."
    - "Breadth of domains and users: shipped both internal enterprise tools and consumer-facing products spanning healthcare, financial services, manufacturing, architecture, transit, and data-center operations — serving executives, business teams, and external end users."
    - "Data-heavy optimization and analytics: built ranking, forecasting, matching, and reporting systems with strong SQL, data preparation, and performance tuning."
    - "Machine Learning: 3 years academic and independent research designing, training, and evaluating ML models for classification, ranking, retrieval, NLP, perception, and sequential decision making (RL/PPO)."

