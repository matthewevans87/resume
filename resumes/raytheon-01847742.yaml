mission_statement:
  - "Software Engineer with 15 years' experience shipping production systems. M.S. Computer Science (ML) from UT Dallas (2025)."
  - "Pivoting to cleared Software Engineering roles in hard-tech domains (space, remote sensing, and autonomy) on teams making civilization-scale impact."

qualifications:
  title: "Qualifications"
  items:
    - "Education: M.S. Computer Science (Machine Learning concentration) from UT Dallas (2025) (3.73 / 4.0)."
    - "Delivery: 15 years building and shipping production systems, including multi-tenant enterprise and consumer facing products across consulting and in-house roles."
    - "Software Engineering: Polyglot. C# / .NET, TypeScript, SQL, C++ (CMake, GoogleTest), Python (PyTorch, NumPy, TensorFlow). Object-Objected Design. CI/CD / DevOps; automated testing; Development against Linux environments."
    - "Cloud Infrastructure: Serverless and containerized workloads on AWS and Azure; event-driven ETL; application logging and metrics (Application Insights, CloudWatch, Seq); fully-scripted IoC defined cloud environments."
    - "Data Analysis: Python (Pandas). SQL (Procedures, Views, Recursive CTEs, Indices, etc.)"
    - "Automation: Process automation using Python, JavaScript/NodeJS, Bash/Shell, C#, task runners, etc."
    - "Coordination & Collaboration: Consulting experience (6+ years). Proven ability to effectively collaborate and communicate both horizontally (team) vertically (managing stakeholders)."
    - "Agile Workflows: Served as Scrum Master on Agile teams. Led Agile trainings with 50+ participants. Familiar with both Sprint and Kanban frameworks. Atlassian /Jira / Azure DevOps."
    - "Hardware: Undergraduate coursework in digital electronics, including lab work. Graduate coursework in Computer Architecture."
    - "Software/Hardware Integration: Experience working with SO-101 robotic arm, ROS, LeRobot; trained and deployed PPO vision-based policies on real robotics hardware."
    - "Telemetry / Data Collection: Experience building event-driven systems to capture cloud-scale telemetry and provide real-time monitoring. Built ranking, forecasting, matching, and reporting systems with strong SQL, data preparation, and performance tuning."
    - "Protocols: Deep experience with RESTful web services communicating over custom protocols, structured data, etc."
    - "Clearance: US Citizen eligible to obtain clearance."

