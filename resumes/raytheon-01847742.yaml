# https://globalhr.wd5.myworkdayjobs.com/REC_RTX_Ext_Gateway/job/US-AZ-TUCSON-M13--3601-E-Britannia-Dr--BRITANNIA-M13/Senior-Embedded-Software-Engineer_01847742
# Senior Embedded Software Engineer
# Our Senior Embedded Software Engineer is a technical position that works in an Integrated Product Team (IPT) environment to architect, design, implement, test, debug, and deploy Software for Firmware (FPGA) and Hardware solutions that meet current and next generation autonomous avionics systems’ needs. Working with a cross-discipline team, the candidate must have experience developing, testing, and integrating software for edge or embedded devices and/or subsystems (like telecom, medical, IoT, automotive, or robotics) where hardware operation, time critical function, functional reliability, mission assurance, and safety might be major concerns.
# The successful candidate will work with Product Owners, Chief Engineers, Management and other IPT members using Lean and/or Agile practices to ensure that embedded software is designed and developed to reliably operate toward the intended functions.
# This position is within the Effectors Center of the Software organization, and is an onsite role located in Tucson, AZ.
# raytheon-01847742

personal:
  location: Richardson, TX, Open to Relocation

